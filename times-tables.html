<!DOCTYPE html><html><head><meta charset="utf-8"><title>Times Table Talk!</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font-family:"Comic Sans MS",Arial,sans-serif;background:linear-gradient(135deg,#ffd36e,#ff7eb3,#7ec8ff);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#333}
.card{background:#fff;border-radius:30px;padding:30px 40px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2);width:min(90vw,480px)}
h1{color:#ff5e9c;margin:0 0 10px}
#problem{font-size:72px;font-weight:bold;color:#4a6cf7;margin:20px 0;transition:transform .2s}
#problem.ok{transform:scale(1.15);color:#2ecc71}
#timer{font-size:28px;color:#ff8c00}#score{font-size:22px}
#heard{min-height:28px;font-size:20px;color:#888}
button{font-size:26px;padding:14px 34px;border:none;border-radius:50px;background:#2ecc71;color:#fff;cursor:pointer;margin:10px}
button:hover{background:#27ae60}#cheer{font-size:40px;min-height:50px}
input{font-size:24px;width:120px;text-align:center;border-radius:12px;border:2px solid #4a6cf7}
</style></head><body><div class="card">
<h1>🎤 Times Table Talk!</h1>
<div id="timer">⏱️ 60</div><div id="score">⭐ 0 / 0</div>
<div id="problem">Ready?</div><div id="cheer"></div>
<div id="heard">Press Start and say your answer out loud!</div>
<div id="typed" style="display:none"><input id="ans" type="number"><button id="go">✔</button></div>
<button id="start">▶️ Start</button>
<p style="font-size:13px;color:#999">Mic not working in Edge? In this folder run <b>python -m http.server 8000</b>, then open <b>http://localhost:8000/times-tables.html</b>. Voice needs internet. Chrome works too.</p></div>
<script>
const words={zero:0,oh:0,one:1,won:1,two:2,to:2,too:2,three:3,four:4,for:4,five:5,six:6,seven:7,eight:8,ate:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
function toNum(t){t=t.toLowerCase().replace(/-/g,' ');const d=t.match(/\d+/);if(d)return +d[0];let total=0,cur=0,found=false;
for(const w of t.split(/\s+/)){if(w in words){cur+=words[w];found=true}else if(w==='hundred'&&found){cur*=100}}total+=cur;return found?total:null}
const $=id=>document.getElementById(id);let a,b,correct,tries,left,tick,running=false,rec=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function next(){a=1+Math.floor(Math.random()*12);b=1+Math.floor(Math.random()*12);$('problem').textContent=`${a} × ${b}`}
function check(n){if(!running||n===null)return;tries++;
if(n===a*b){correct++;$('cheer').textContent=['🎉','🌟','👏','🥳','💯'][Math.floor(Math.random()*5)];$('problem').classList.add('ok');
setTimeout(()=>{$('problem').classList.remove('ok');$('cheer').textContent='';next()},400)}
else{$('cheer').textContent='🤔 Try again!'}$('score').textContent=`⭐ ${correct} / ${tries}`}
function listen(){if(!SR)return;rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;let lastQ='';
rec.onresult=e=>{const r=e.results[e.results.length-1];const t=r[0].transcript;$('heard').textContent='I heard: "'+t+'"';const n=toNum(t);const q=a+'x'+b;
if(n===a*b&&lastQ!==q){lastQ=q;check(n)}else if(r.isFinal&&lastQ!==q){check(n)}};
rec.onerror=e=>{const m={'not-allowed':'🎙️ Mic blocked. Click the lock/🎙️ icon in the address bar, choose Allow, then Play Again.','service-not-allowed':'🎙️ Edge blocks voice on files opened from disk. Open it from a web link (http://localhost) instead, or type answers below.','network':'🌐 Edge voice needs internet. Check your connection, or type answers below.','audio-capture':'🎙️ No microphone found. Plug one in or type answers below.'};
if(e.error==='no-speech'||e.error==='aborted')return;$('heard').textContent=m[e.error]||('Voice error: '+e.error+'. Type answers below.');$('typed').style.display='block';if(e.error!=='network')running&&(rec.onend=null)};
rec.onend=()=>{if(running&&rec.onend)try{rec.start()}catch(_){}};try{rec.start()}catch(err){$('heard').textContent='Could not start voice: '+err.message;$('typed').style.display='block'}}
async function start(){
if(SR&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){try{$('heard').textContent='Asking for the microphone... click Allow!';const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop())}
catch(err){$('heard').textContent=(location.protocol==='file:'?'🎙️ Edge won\'t allow the mic on a file opened from disk. Run it from http://localhost (see note below), or type your answers.':'🎙️ Mic permission denied. Click the lock icon in the address bar, Allow microphone, then try again.');$('typed').style.display='block'}}correct=0;tries=0;left=60;running=true;$('start').style.display='none';$('score').textContent='⭐ 0 / 0';$('timer').textContent='⏱️ 60';
if(!SR){$('heard').textContent='Voice not supported here, so type your answer!';$('typed').style.display='block'}else $('heard').textContent='Say your answer!';
next();listen();tick=setInterval(()=>{left--;$('timer').textContent='⏱️ '+left;if(left<=0)stop()},1000)}
function stop(){running=false;clearInterval(tick);if(rec)rec.stop();$('problem').textContent='⏰ Time!';
$('cheer').textContent=correct>=15?'🏆':correct>=8?'🌟':'👍';$('heard').textContent=`You got ${correct} right out of ${tries} tries!`;
$('start').textContent='🔁 Play Again';$('start').style.display='inline-block';$('typed').style.display='none'}
$('start').onclick=start;$('go').onclick=()=>{check(+$('ans').value);$('ans').value=''};
$('ans').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
</script></body></html>
